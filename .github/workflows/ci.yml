name: ci

# Push-triggered build + release: verifies the composed app compiles on every
# human push to main and releases the Linux bundle under the current version
# tag - no version bumps, no changelog, no commits (the user bumps versions by
# hand; the sync bot handles real upstream syncs). Releases are create-only: a
# version's release is written once, and a push whose tag already has one still
# builds but does not touch the release.
# Bot sync commits are skipped (see the job condition below).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  build-linux:
    # Bot sync commits are already built here, and released when green, by
    # upstream-sync, so rebuilding them would spend a second run and replace
    # that release's asset with this build instead. The bot also puts GitHub's
    # skip marker in its commit message, which stops this workflow from being
    # triggered at all; this check covers a bot commit pushed without it.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 18 (pkg)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node22-${{ runner.os }}

      - name: Pre-fetch pkg base binaries
        run: |
          # pkg's own undici fetch silently fails on GitHub runners; curl works.
          mkdir -p ~/.pkg-cache/v3.6
          for t in linux-x64 win-x64 macos-x64; do
            f=~/.pkg-cache/v3.6/fetched-v22.23.2-$t
            [ -f "$f" ] || curl -fsSL --retry 3 "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v22.23.2-$t" -o "$f"
            chmod +x "$f"
          done

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libsoup-3.0-dev libmpv-dev libsecret-1-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compose
        run: ./.scripts/compose.sh

      - name: Build Linux
        run: ./.scripts/build.sh linux

      - name: Package Linux bundle
        run: |
          cd .build/app/build/linux/x64/release
          tar czf "$GITHUB_WORKSPACE/yuri-reader-linux.tar.gz" bundle/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists - refusing to rewrite it"
            exit 0
          fi
          gh release create "$TAG" yuri-reader-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Yuri-Reader $TAG" \
            --notes "Build from $(git rev-parse --short HEAD)"