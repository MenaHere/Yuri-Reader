name: ci

# Push-triggered build check: verifies the composed app compiles on every
# push to main. No version bumps, no changelog, no commits, no releases -
# that is the sync bot's job. This is the fast feedback loop for manual
# changes (the user bumps versions by hand).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 18 (pkg)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node18-${{ runner.os }}

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-3.41.9-${{ runner.os }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9   # matches Dart ^3.11.5 in dart/pubspec.yaml
          cache: true

      - name: Compose
        run: ./.scripts/compose.sh

      - name: Flutter analyze
        run: |
          cd .build/app
          flutter pub get
          dart pub get --directory=rust_builder/cargokit/build_tool
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Linux
        run: ./.scripts/build.sh linux