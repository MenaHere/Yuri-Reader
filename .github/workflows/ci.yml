# SPDX-License-Identifier: Apache-2.0
name: ci

# Pure CI: verifies the composed app analyzes cleanly on every human push to
# main. It never builds and never touches a release. The release workflow
# (release.yml) is triggered by the same push and does the build + release for
# every platform, gated on the changelog. Bot sync commits are skipped (see the
# job condition below); upstream-sync runs its own release.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - '.package/README.md'

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  analyze:
    # Bot sync commits are analyzed and released by upstream-sync, so running
    # here would spend a second run. The bot also puts GitHub's skip marker in
    # its commit message, which stops this workflow from being triggered at
    # all; this check covers a bot commit pushed without it.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compose
        run: ./.scripts/compose.sh

      - name: Flutter pub get
        working-directory: .build/app
        run: flutter pub get

      - name: Cargokit pub get
        working-directory: .build/app
        run: dart pub get --directory=rust_builder/cargokit/build_tool

      - name: Flutter analyze
        working-directory: .build/app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings