name: upstream-sync

# Weekend bot: tries to sync Yuri-Reader with upstream mangayomi + malsync,
# builds Linux, and releases the bundle on success.
# - No upstream updates (and not forced) -> run succeeds silently.
# - Sync + build green -> BotYYYYMMDDnnn commit (submodule bumps + version
#   bump + changelog entry) and a GitHub Release (tag v<version>).
# - Releases are create-only: if the tag already has a release, the run refuses
#   to rewrite it. A change that deserves a release gets a new version.
# - Sync + build red -> the same commit without a version bump, the changelog
#   entry marked `## Unreleased`, and no release. The sync still lands on main
#   so the code can be fixed against the new upstream.
# - Anything breaks -> run fails, which is the only notification you get.

on:
  schedule:
    - cron: '0 9 * * 0,6'   # Sat + Sun 09:00 UTC (17:00 +0800)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even without upstream updates (the release is still create-only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for upstream updates
        id: check
        run: |
          git -C dart/vendor/mangayomi fetch origin main
          git -C ts/vendor/malsync fetch origin master
          CUR_MANGA="$(git -C dart/vendor/mangayomi rev-parse HEAD)"
          LATEST_MANGA="$(git -C dart/vendor/mangayomi rev-parse origin/main)"
          CUR_MAL="$(git -C ts/vendor/malsync rev-parse HEAD)"
          LATEST_MAL="$(git -C ts/vendor/malsync rev-parse origin/master)"
          MANGA_COUNT="$(git -C dart/vendor/mangayomi rev-list --count "$CUR_MANGA".."$LATEST_MANGA" 2>/dev/null || echo 0)"
          MAL_COUNT="$(git -C ts/vendor/malsync rev-list --count "$CUR_MAL".."$LATEST_MAL" 2>/dev/null || echo 0)"
          echo "mangayomi: $CUR_MANGA -> $LATEST_MANGA ($MANGA_COUNT commits)"
          echo "malsync:   $CUR_MAL -> $LATEST_MAL ($MAL_COUNT commits)"
          if [ "$CUR_MANGA" = "$LATEST_MANGA" ] && [ "$CUR_MAL" = "$LATEST_MAL" ]; then
            echo "real=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.force }}" != "true" ]; then
              echo "No upstream updates - nothing to sync."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "mangayomi=$LATEST_MANGA" >> "$GITHUB_OUTPUT"
            echo "malsync=$LATEST_MAL" >> "$GITHUB_OUTPUT"
            echo "manga_count=$MANGA_COUNT" >> "$GITHUB_OUTPUT"
            echo "mal_count=$MAL_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump submodules
        if: steps.check.outputs.real == 'true'
        run: |
          git -C dart/vendor/mangayomi checkout "${{ steps.check.outputs.mangayomi }}"
          git -C ts/vendor/malsync checkout "${{ steps.check.outputs.malsync }}"

      - name: Sync dependency manifests
        if: steps.check.outputs.real == 'true'
        run: ./.scripts/sync-deps.sh

      - name: Setup Node 18 (pkg)
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Cache pkg binaries
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node22-${{ runner.os }}

      - name: Pre-fetch pkg base binaries
        if: steps.check.outputs.changed == 'true'
        run: |
          # pkg's own undici fetch silently fails on GitHub runners; curl works.
          mkdir -p ~/.pkg-cache/v3.6
          for t in linux-x64 win-x64 macos-x64; do
            f=~/.pkg-cache/v3.6/fetched-v22.23.2-$t
            [ -f "$f" ] || curl -fsSL --retry 3 "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v22.23.2-$t" -o "$f"
            chmod +x "$f"
          done

      - name: Install Linux build deps
        if: steps.check.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libsoup-3.0-dev libmpv-dev libsecret-1-dev

      - name: Install Flutter
        if: steps.check.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compose
        if: steps.check.outputs.changed == 'true'
        run: ./.scripts/compose.sh

      - name: Flutter pub get
        if: steps.check.outputs.changed == 'true'
        working-directory: .build/app
        run: flutter pub get

      - name: Cargokit pub get
        if: steps.check.outputs.changed == 'true'
        working-directory: .build/app
        run: dart pub get --directory=rust_builder/cargokit/build_tool

      - name: Flutter analyze
        if: steps.check.outputs.changed == 'true'
        working-directory: .build/app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compose + build Linux
        if: steps.check.outputs.changed == 'true'
        run: ./.scripts/build.sh linux

      - name: Package Linux bundle
        if: steps.check.outputs.changed == 'true'
        run: |
          cd .build/app/build/linux/x64/release
          tar czf "$GITHUB_WORKSPACE/yuri-reader-linux.tar.gz" bundle/

      # The sync is committed whether or not the build worked, so a failed sync
      # still lands on main and the code can be fixed against the new upstream.
      # The two changelog steps pick released vs unreleased with the step
      # status functions, which are only valid in if: - success() means every
      # earlier step passed, failure() means one of them did not.
      - name: Changelog (released)
        if: success() && steps.check.outputs.real == 'true'
        run: |
          VER="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
          if [[ "$VER" == *+* ]]; then
            BASE="${VER%+*}"
            BUILD="${VER##*+}"
            NEW_VER="${BASE}+$((BUILD + 1))"
          else
            NEW_VER="${VER}+1"
          fi
          sed -i "s/^version: .*/version: $NEW_VER/" dart/pubspec.yaml
          DATE="$(date -u +%Y-%m-%d)"
          BULLET="- Synced ${{ steps.check.outputs.manga_count }} commits from [mangayomi](https://github.com/kodjodevf/mangayomi), ${{ steps.check.outputs.mal_count }} commits from [malsync](https://github.com/MALSync/MALSync)"
          if [ "$(sed -n '3p' CHANGELOG.md)" = "## Unreleased" ]; then
            # A pending sync finally builds: turn its section into this version.
            awk -v h="## Version $NEW_VER" -v b="$BULLET" '
              NR==3 && $0=="## Unreleased" { print h; next }
              !ins && /^#### Bot$/ { print; print b; ins=1; next }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          else
            {
              printf '# Yuri-Reader - Change Log\n\n'
              printf '## Version %s\n\n### [%s]\n\n#### Bot\n' "$NEW_VER" "$DATE"
              printf -- '%s\n' "$BULLET"
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          fi
          echo "version: $VER -> $NEW_VER"

      - name: Changelog (unreleased)
        if: failure() && steps.check.outputs.real == 'true'
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          BULLET="- [$DATE] Synced ${{ steps.check.outputs.manga_count }} commits from [mangayomi](https://github.com/kodjodevf/mangayomi), ${{ steps.check.outputs.mal_count }} commits from [malsync](https://github.com/MALSync/MALSync)"
          if [ "$(sed -n '3p' CHANGELOG.md)" = "## Unreleased" ]; then
            # Already pending: append this sync to the same section.
            awk -v b="$BULLET" '
              !ins && /^#### Bot$/ { print; print b; ins=1; next }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          else
            {
              printf '# Yuri-Reader - Change Log\n\n'
              printf '## Unreleased\n\n### [%s]\n\n#### Bot\n' "$DATE"
              printf -- '%s\n' "$BULLET"
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          fi

      - name: Commit BotYYYYMMDDnnn
        if: always() && steps.check.outputs.real == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dart/vendor/mangayomi ts/vendor/malsync dart/pubspec.yaml CHANGELOG.md
          SEQ=$(git log --format=%s --grep="^Bot$(date -u +%Y%m%d)" | wc -l)
          # [skip ci]: this commit is already built here, and released here when
          # green. Without it the push would build the same version a second
          # time and replace the bot's release asset with its own build.
          TITLE="Bot$(date -u +%Y%m%d)$(printf '%03d' "$SEQ") [skip ci]"
          git commit -m "$TITLE" -m "Sync mangayomi @ ${{ steps.check.outputs.mangayomi }} + malsync @ ${{ steps.check.outputs.malsync }}" || echo "nothing to commit"

      - name: Push
        if: always() && steps.check.outputs.real == 'true'
        run: git push

      - name: Create release
        if: success() && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists - refusing to rewrite it"
            exit 0
          fi
          gh release create "$TAG" yuri-reader-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Yuri-Reader $TAG" \
            --notes "Sync mangayomi @ ${{ steps.check.outputs.mangayomi }} + malsync @ ${{ steps.check.outputs.malsync }}"