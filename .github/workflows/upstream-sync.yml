# SPDX-License-Identifier: Apache-2.0
name: upstream-sync

# Sync bot: tries to sync Yuri-Reader with upstream mangayomi + malsync, then
# hands the build and release to the reusable release workflow, which builds
# every platform (Linux + Android + Flatpak) and releases all of them.
# - No upstream updates (and not forced) -> run succeeds silently.
# - Sync + analyze green, newest changelog section a version -> BotYYYYMMDDnnn
#   commit (submodule bumps + version bump + changelog entry) and the release
#   workflow releases all platforms.
# - Sync + analyze green, newest section `## Unreleased` -> the sync is recorded
#   under `## Unreleased` with no version bump and no release: that section is a
#   pending (usually human) release and must not ship as a `+1`.
# - Sync + analyze red -> the same commit without a version bump, the changelog
#   entry marked `## Unreleased`, and no release. The sync still lands on main
#   so the code can be fixed against the new upstream.
# - Anything breaks -> run fails, which is the only notification you get.

on:
  schedule:
    - cron: '0 0 * * 1,3,5'   # Mon + Wed + Fri 00:00 UTC (08:00 +0800)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even without upstream updates (the release is still create-only)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      # False only when there is no upstream update and no force. The release
      # job gates on it so a scheduled no-op run does not call the release
      # workflow (which, seeing a released version at the top of the changelog,
      # rebuilt and republished it in full).
      changed: ${{ steps.check.outputs.changed }}
      # True only when the green changelog step made a new version. A sync that
      # landed under `## Unreleased` leaves this empty, so it is not released.
      released: ${{ steps.changelog.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for upstream updates
        id: check
        run: |
          git -C dart/vendor/mangayomi fetch origin main
          git -C ts/vendor/malsync fetch origin master
          CUR_MANGA="$(git -C dart/vendor/mangayomi rev-parse HEAD)"
          LATEST_MANGA="$(git -C dart/vendor/mangayomi rev-parse origin/main)"
          CUR_MAL="$(git -C ts/vendor/malsync rev-parse HEAD)"
          LATEST_MAL="$(git -C ts/vendor/malsync rev-parse origin/master)"
          MANGA_COUNT="$(git -C dart/vendor/mangayomi rev-list --count "$CUR_MANGA".."$LATEST_MANGA" 2>/dev/null || echo 0)"
          MAL_COUNT="$(git -C ts/vendor/malsync rev-list --count "$CUR_MAL".."$LATEST_MAL" 2>/dev/null || echo 0)"
          echo "mangayomi: $CUR_MANGA -> $LATEST_MANGA ($MANGA_COUNT commits)"
          echo "malsync:   $CUR_MAL -> $LATEST_MAL ($MAL_COUNT commits)"
          if [ "$CUR_MANGA" = "$LATEST_MANGA" ] && [ "$CUR_MAL" = "$LATEST_MAL" ]; then
            echo "real=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.force }}" != "true" ]; then
              echo "No upstream updates - nothing to sync."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "mangayomi=$LATEST_MANGA" >> "$GITHUB_OUTPUT"
            echo "malsync=$LATEST_MAL" >> "$GITHUB_OUTPUT"
            echo "manga_count=$MANGA_COUNT" >> "$GITHUB_OUTPUT"
            echo "mal_count=$MAL_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump submodules
        if: steps.check.outputs.real == 'true'
        run: |
          git -C dart/vendor/mangayomi checkout "${{ steps.check.outputs.mangayomi }}"
          git -C ts/vendor/malsync checkout "${{ steps.check.outputs.malsync }}"

      - name: Sync dependency manifests
        if: steps.check.outputs.real == 'true'
        run: ./.scripts/sync-deps.sh

      - name: Install Flutter
        if: steps.check.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compose
        if: steps.check.outputs.changed == 'true'
        run: ./.scripts/compose.sh

      - name: Flutter pub get
        if: steps.check.outputs.changed == 'true'
        working-directory: .build/app
        run: flutter pub get

      - name: Cargokit pub get
        if: steps.check.outputs.changed == 'true'
        working-directory: .build/app
        run: dart pub get --directory=rust_builder/cargokit/build_tool

      # The bot's gate: analyze errors only. A green analyze releases the sync
      # (version bump + release) only when the newest changelog section is
      # already a version; a red one means the sync is committed as
      # `## Unreleased` with no release. The heavy per-platform builds and the
      # release itself are done by the reusable release workflow.
      - name: Flutter analyze
        if: steps.check.outputs.changed == 'true'
        working-directory: .build/app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # The sync is committed whether or not the analyze passed, so a failed
      # sync still lands on main and the code can be fixed against the new
      # upstream. The two changelog steps pick green vs red with the step status
      # functions, which are only valid in if: - success() means every earlier
      # step passed, failure() means one of them did not.
      #
      # A release happens only when the newest section is already a version.
      # When it is `## Unreleased` the sync is recorded under it and nothing is
      # released: that section is a pending (usually human) release, possibly a
      # major one, and renaming it to `+1` would ship it as a patch.
      - name: Changelog (green)
        id: changelog
        if: success() && steps.check.outputs.real == 'true'
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          BULLET="- Synced ${{ steps.check.outputs.manga_count }} commits from [mangayomi](https://github.com/kodjodevf/mangayomi), ${{ steps.check.outputs.mal_count }} commits from [malsync](https://github.com/MALSync/MALSync)"
          if [ "$(sed -n '3p' CHANGELOG.md)" = "## Unreleased" ]; then
            # Pending release: record the sync under it, do not bump or release.
            # A fresh `#### Bot` goes right after the section's `### [date]`
            # line, above whatever is already there (newest on top).
            awk -v b="$BULLET" '
              !ins && /^### \[/ { print; print ""; print "#### Bot"; print b; ins=1; next }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            # Newest section is a version: this sync is its own release.
            VER="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
            if [[ "$VER" == *+* ]]; then
              BASE="${VER%+*}"
              BUILD="${VER##*+}"
              NEW_VER="${BASE}+$((BUILD + 1))"
            else
              NEW_VER="${VER}+1"
            fi
            sed -i "s/^version: .*/version: $NEW_VER/" dart/pubspec.yaml
            {
              printf '# Yuri-Reader - Change Log\n\n'
              printf '## Version %s\n\n### [%s]\n\n#### Bot\n' "$NEW_VER" "$DATE"
              printf -- '%s\n' "$BULLET"
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version: $VER -> $NEW_VER"
          fi

      - name: Changelog (red)
        if: failure() && steps.check.outputs.real == 'true'
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          BULLET="- [$DATE] Synced ${{ steps.check.outputs.manga_count }} commits from [mangayomi](https://github.com/kodjodevf/mangayomi), ${{ steps.check.outputs.mal_count }} commits from [malsync](https://github.com/MALSync/MALSync)"
          if [ "$(sed -n '3p' CHANGELOG.md)" = "## Unreleased" ]; then
            # Already pending: record this sync under it, newest on top.
            awk -v b="$BULLET" '
              !ins && /^### \[/ { print; print ""; print "#### Bot"; print b; ins=1; next }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          else
            {
              printf '# Yuri-Reader - Change Log\n\n'
              printf '## Unreleased\n\n### [%s]\n\n#### Bot\n' "$DATE"
              printf -- '%s\n' "$BULLET"
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
          fi

      - name: Commit BotYYYYMMDDnnn
        if: always() && steps.check.outputs.real == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dart/vendor/mangayomi ts/vendor/malsync dart/pubspec.yaml CHANGELOG.md
          SEQ=$(git log --format=%s --grep="^Bot$(date -u +%Y%m%d)" | wc -l)
          # [skip ci]: this commit is already built and released here by the
          # release workflow. Without it the push would build the same version
          # a second time and replace the bot's release asset with its own.
          TITLE="Bot$(date -u +%Y%m%d)$(printf '%03d' "$SEQ") [skip ci]"
          git commit -m "$TITLE" -m "Sync mangayomi @ ${{ steps.check.outputs.mangayomi }} + malsync @ ${{ steps.check.outputs.malsync }}" || echo "nothing to commit"

      - name: Push
        if: always() && steps.check.outputs.real == 'true'
        run: git push

  # Builds every platform and releases all of them. Runs only when the sync job
  # changed something (upstream updates, or a forced run), succeeded (analyze
  # green), and its newest changelog section was already a version, so it made a
  # release. A sync recorded under `## Unreleased` does not call this.
  release:
    needs: sync
    if: success() && needs.sync.outputs.changed == 'true' && needs.sync.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit