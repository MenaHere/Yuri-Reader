name: android

# Builds the signed release APK on every human push to main and attaches it to
# the release for the current version. The release itself is created only when
# the changelog's newest section is a released `## Version X.Y.Z` (a version
# bump); a push whose changelog is still `## Unreleased` builds and verifies but
# does not touch any release. See the release policy in AGENTS.md.
#
# Signing needs four repository secrets (never committed):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build-android:
    # Bot sync commits are built and released by upstream-sync.
    if: github.event.head_commit.author.name != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 18 (pkg)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node22-${{ runner.os }}

      - name: Pre-fetch pkg base binaries
        run: |
          # pkg's own undici fetch silently fails on GitHub runners; curl works.
          mkdir -p ~/.pkg-cache/v3.6
          for t in linux-x64 win-x64 macos-x64; do
            f=~/.pkg-cache/v3.6/fetched-v22.23.2-$t
            [ -f "$f" ] || curl -fsSL --retry 3 "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v22.23.2-$t" -o "$f"
            chmod +x "$f"
          done

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compose
        run: ./.scripts/compose.sh

      - name: Write the Android signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > .build/app/android/app/yurireader.jks
          cat > .build/app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=yurireader.jks
          EOF

      - name: Build the signed APK
        run: ./.scripts/build.sh android

      - name: Rename the APK
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
          cp .build/app/build/app/outputs/flutter-apk/app-release.apk \
             "yuri-reader-${VERSION}.apk"

      - name: Create or update the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
          TAG="v${VERSION}"
          TOP="$(grep -m1 '^## ' CHANGELOG.md)"
          if [ "$TOP" = "## Unreleased" ]; then
            echo "changelog is Unreleased - build only, no release"
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Yuri-Reader $TAG" \
              --notes "Built from $(git rev-parse --short HEAD)"
          fi
          gh release upload "$TAG" "yuri-reader-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
