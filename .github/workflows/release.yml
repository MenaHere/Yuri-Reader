# SPDX-License-Identifier: Apache-2.0
name: release

# Builds every platform and attaches all assets to the release for the current
# version. Triggers on a push to main and can also be called by upstream-sync.yml
# (after a sync). A release is created/updated only when the changelog's newest
# section is a released `## Version X.Y.Z`; while it is `## Unreleased`, the
# gate job reports publish=false and nothing is built or released.
#
# build-linux and build-android run in parallel; the release job waits for both,
# attaches their assets, then builds and deploys the Flatpak.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - '.package/README.md'
  workflow_call:
    inputs:
      linux:
        description: Build the Linux bundle
        type: boolean
        default: true
      android:
        description: Build the signed Android APK
        type: boolean
        default: true
      flatpak:
        description: Rebuild and publish the Flatpak remote
        type: boolean
        default: true
      version:
        description: Release version to publish (e.g. 0.7.1); overrides the built version and bypasses the changelog gate
        type: string
        default: ''
      ref:
        description: Git ref to build from (defaults to the ref that triggered the run)
        type: string
        default: ''
      replace:
        description: Replace existing release assets instead of adding only missing ones
        type: boolean
        default: false
      force:
        description: Build even when the changelog's newest section is Unreleased (used by the manual pack)
        type: boolean
        default: false
    secrets:
      # A caller passes these with `secrets: inherit`. They are optional so a
      # Linux-only pack needs neither the keystore nor the Flatpak key.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      YURIREADER_FLATPAK_GPG_PRIVATE_KEY:
        required: false
      YURIREADER_FLATPAK_GPG_PASSPHRASE:
        required: false
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  gate:
    name: "gate in[linux=${{ inputs.linux }} android=${{ inputs.android }} flatpak=${{ inputs.flatpak }} force=${{ inputs.force }}]"
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      replace: ${{ steps.check.outputs.replace }}
      linux: ${{ steps.check.outputs.linux }}
      android: ${{ steps.check.outputs.android }}
      flatpak: ${{ steps.check.outputs.flatpak }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Show the requested platforms
        run: |
          echo "linux=${{ inputs.linux }} android=${{ inputs.android }} flatpak=${{ inputs.flatpak }} version='${{ inputs.version }}' ref='${{ inputs.ref }}' replace=${{ inputs.replace }} force=${{ inputs.force }}"
      - name: Decide whether to publish
        id: check
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            # A manual pack always builds, whatever the changelog says.
            publish=true
          elif [ "$(grep -m1 '^## ' CHANGELOG.md)" = "## Unreleased" ]; then
            publish=false
          else
            publish=true
          fi
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="$(sed -n 's/^version: //p' dart/pubspec.yaml)"
          fi
          # Normalize the platform flags to literal true/false strings: an
          # absent input (push, or release.yml dispatched by hand) means
          # "selected"; only an explicit false means "not selected".
          norm() { if [ "$1" = "false" ]; then echo false; else echo true; fi; }
          {
            echo "publish=$publish"
            echo "version=$version"
            echo "replace=${{ inputs.replace }}"
            echo "linux=$(norm '${{ inputs.linux }}')"
            echo "android=$(norm '${{ inputs.android }}')"
            echo "flatpak=$(norm '${{ inputs.flatpak }}')"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node 24 (pkg)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node22-${{ runner.os }}

      - name: Pre-fetch pkg base binaries
        run: |
          # pkg's own undici fetch silently fails on GitHub runners; curl works.
          mkdir -p ~/.pkg-cache/v3.6
          for t in linux-x64 win-x64 macos-x64; do
            f=~/.pkg-cache/v3.6/fetched-v22.23.2-$t
            [ -f "$f" ] || curl -fsSL --retry 3 "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v22.23.2-$t" -o "$f"
            chmod +x "$f"
          done

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config patchelf flatpak ostree libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libsoup-3.0-dev libmpv-dev libsecret-1-dev libwebp-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compose
        run: ./.scripts/compose.sh

      - name: Resolve the Flatpak runtime's libraries
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51
          # Every soname the runtime provides. build.sh bundles the rest of
          # libmpv's closure, so nothing the runtime lacks can be missed and
          # nothing it provides is shadowed. The runtime's set is authoritative:
          # its libjpeg/.so.62 and libavcodec/.so.62 differ from the runner's
          # .so.8/.so.60, and it has no libXpresent at all.
          find ~/.local/share/flatpak/runtime/*/x86_64/*/active/files \
               ~/.local/share/flatpak/runtime/*/x86_64/*/*/files \
               -name '*.so*' -printf '%f\n' 2>/dev/null | sort -u \
            > "$RUNNER_TEMP/runtime-sonames.txt"
          echo "runtime provides $(wc -l < "$RUNNER_TEMP/runtime-sonames.txt") libraries"
          echo "FLATPAK_RUNTIME_LIBS=$RUNNER_TEMP/runtime-sonames.txt" >> "$GITHUB_ENV"

      - name: Build Linux
        run: ./.scripts/build.sh linux

      - name: Package Linux bundle
        run: |
          cd .build/app/build/linux/x64/release
          tar czf "$GITHUB_WORKSPACE/yuri-reader-linux.tar.gz" bundle/

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: yuri-reader-linux.tar.gz

  build-android:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node 24 (pkg)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node22-${{ runner.os }}

      - name: Pre-fetch pkg base binaries
        run: |
          # pkg's own undici fetch silently fails on GitHub runners; curl works.
          mkdir -p ~/.pkg-cache/v3.6
          for t in linux-x64 win-x64 macos-x64; do
            f=~/.pkg-cache/v3.6/fetched-v22.23.2-$t
            [ -f "$f" ] || curl -fsSL --retry 3 "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v22.23.2-$t" -o "$f"
            chmod +x "$f"
          done

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compose
        run: ./.scripts/compose.sh

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./.scripts/build.sh android

      - name: Rename the APK
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
          cp .build/app/build/app/outputs/flutter-apk/app-release.apk \
             "yuri-reader-${VERSION}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: yuri-reader-*.apk

  release:
    name: "release out[linux=${{ needs.gate.outputs.linux }} android=${{ needs.gate.outputs.android }} flatpak=${{ needs.gate.outputs.flatpak }} publish=${{ needs.gate.outputs.publish }}]"
    needs: [gate, build-linux, build-android]
    # A status check is needed so an unselected platform (skipped build) does
    # not skip the release; !failure() so a failed build still blocks it.
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Download the Linux bundle
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle

      - name: Download the APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Name the APK after the release version
        run: |
          set -euo pipefail
          VERSION="${{ needs.gate.outputs.version }}"
          for f in yuri-reader-*.apk; do
            [ -e "$f" ] || continue
            [ "$f" = "yuri-reader-${VERSION}.apk" ] || mv "$f" "yuri-reader-${VERSION}.apk"
          done

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ needs.gate.outputs.replace }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.gate.outputs.version }}"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Yuri-Reader $TAG" \
              --notes "Built from $(git rev-parse --short HEAD)"
          fi
          # Upload only the assets this run built. A normal run adds only the
          # ones the release is missing; a pack with replace=true overwrites.
          assets=()
          [ -f yuri-reader-linux.tar.gz ] && assets+=(yuri-reader-linux.tar.gz)
          [ -f "yuri-reader-${VERSION}.apk" ] && assets+=("yuri-reader-${VERSION}.apk")
          for asset in "${assets[@]}"; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --json assets -q '.assets[].name' | grep -qx "$asset"; then
              if [ "$REPLACE" = "true" ]; then
                echo "replacing $asset on $TAG"
                gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
              else
                echo "$asset is already on $TAG - leaving it"
              fi
            else
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

  flatpak:
    name: "flatpak out=${{ needs.gate.outputs.flatpak }} publish=${{ needs.gate.outputs.publish }}"
    needs: [gate, release]
    # A status function is required here: the platform builds upstream of
    # `release` are skipped when unselected, and a skipped job propagates to
    # every downstream job unless its `if` contains one. !failure() still blocks
    # the Flatpak when a selected build actually fails.
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.publish == 'true' && needs.gate.outputs.flatpak == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install the Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder jq ostree
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Import the repository signing key
        env:
          YURIREADER_FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.YURIREADER_FLATPAK_GPG_PRIVATE_KEY }}
          YURIREADER_FLATPAK_GPG_PASSPHRASE: ${{ secrets.YURIREADER_FLATPAK_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=""
          for n in YURIREADER_FLATPAK_GPG_PRIVATE_KEY YURIREADER_FLATPAK_GPG_PASSPHRASE; do
            eval "v=\$$n"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/flatpak-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' 'pinentry-mode loopback' > "$GNUPGHOME/gpg.conf"
          printf '%s\n' 'allow-loopback-pinentry' 'allow-preset-passphrase' \
            > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          # Capture the import output: it names the key id, and the keygrip is
          # the filename gpg stores the secret key under. Both are read without
          # a second gpg call, which is what kept failing on the runner.
          import_out="$(printf '%s\n' "$YURIREADER_FLATPAK_GPG_PRIVATE_KEY" \
            | gpg --batch --import 2>&1)"
          key_id="$(printf '%s\n' "$import_out" \
            | sed -n 's/^gpg: key \([0-9A-F]*\): secret key imported.*/\1/p' \
            | head -1)"
          test -n "$key_id"
          # Cache the passphrase in the agent: flatpak-builder signs through
          # gpg with no tty, so a protected key needs the passphrase preset.
          keygrip="$(basename "$(ls "$GNUPGHOME"/private-keys-v1.d/*.key \
            2>/dev/null | head -1)" .key)"
          test -n "$keygrip"
          preset="$(command -v gpg-preset-passphrase || true)"
          [ -n "$preset" ] || preset="$(find /usr/lib/gnupg /usr/libexec /usr/lib \
            -name gpg-preset-passphrase -type f 2>/dev/null | head -1)"
          test -n "$preset"
          gpg-connect-agent reloadagent /bye
          printf '%s' "$YURIREADER_FLATPAK_GPG_PASSPHRASE" \
            | "$preset" --preset "$keygrip"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Resolve the release asset
        id: asset
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          release="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${version}")"
          asset='yuri-reader-linux.tar.gz'
          url="$(jq -r --arg asset "$asset" \
            '.assets[] | select(.name == $asset) | .browser_download_url' \
            <<<"$release")"
          test -n "$url" && test "$url" != null
          archive="$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 --retry-all-errors -o "$archive" "$url"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          size="$(stat -c%s "$archive")"
          date="$(jq -r '.published_at' <<<"$release" | cut -c1-10)"
          printf 'version=%s\nsha256=%s\nsize=%s\ndate=%s\n' \
            "$version" "$sha256" "$size" "$date" >> "$GITHUB_OUTPUT"

      - name: Generate the Flatpak manifest and metainfo
        env:
          VERSION: ${{ steps.asset.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
          SIZE: ${{ steps.asset.outputs.size }}
          RELEASE_DATE: ${{ steps.asset.outputs.date }}
        run: |
          set -euo pipefail
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA256/g" \
            -e "s/@SIZE@/$SIZE/g" \
            .package/flatpak/com.mena.yurireader.yml.in > .package/flatpak/com.mena.yurireader.yml
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@DATE@/$RELEASE_DATE/g" \
            .package/flatpak/com.mena.yurireader.metainfo.xml.in \
            > .package/flatpak/com.mena.yurireader.metainfo.xml

      - name: Build and sign the Flatpak repository
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/flatpak-repo"
          build="$RUNNER_TEMP/flatpak-build"
          flatpak-builder --force-clean --repo="$repo" --default-branch=stable \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
            --install-deps-from=flathub --user \
            "$build" .package/flatpak/com.mena.yurireader.yml
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" --generate-static-deltas "$repo"
          echo "FLATPAK_REPO=$repo" >> "$GITHUB_ENV"

      - name: Assemble the GitHub Pages site
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/pages"
          mkdir -p "$pages/repo"
          cp -a "$FLATPAK_REPO/." "$pages/repo/"
          gpg --batch --armor --export "$FLATPAK_GPG_KEY_ID" > "$pages/yurireader.gpg"
          gpg_key="$(base64 -w0 "$pages/yurireader.gpg")"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          cat > "$pages/yurireader.flatpakrepo" <<EOF
          [Flatpak Repo]
          Title=YuriReader
          Url=https://${owner}.github.io/${repository}/repo
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Comment=YuriReader Flatpak repository
          Description=Signed Flatpak releases of YuriReader.
          GPGKey=${gpg_key}
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4