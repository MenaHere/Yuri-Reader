# SPDX-License-Identifier: Apache-2.0
name: release

# Builds every platform and attaches all assets to the release for the current
# version. Triggers on a push to main and can also be called by upstream-sync.yml
# (after a sync). A release is created/updated only when the changelog's newest
# section is a released `## Version X.Y.Z`; while it is `## Unreleased`, the
# gate job reports publish=false and nothing is built or released.
#
# build-linux and build-android run in parallel; the release job waits for both,
# attaches their assets, then builds and deploys the Flatpak.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - '.package/README.md'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decide whether to publish
        id: check
        run: |
          TOP="$(grep -m1 '^## ' CHANGELOG.md)"
          if [ "$TOP" = "## Unreleased" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 24 (pkg)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node22-${{ runner.os }}

      - name: Pre-fetch pkg base binaries
        run: |
          # pkg's own undici fetch silently fails on GitHub runners; curl works.
          mkdir -p ~/.pkg-cache/v3.6
          for t in linux-x64 win-x64 macos-x64; do
            f=~/.pkg-cache/v3.6/fetched-v22.23.2-$t
            [ -f "$f" ] || curl -fsSL --retry 3 "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v22.23.2-$t" -o "$f"
            chmod +x "$f"
          done

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config patchelf libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libsoup-3.0-dev libmpv-dev libsecret-1-dev libwebp-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compose
        run: ./.scripts/compose.sh

      - name: Build Linux
        run: ./.scripts/build.sh linux

      - name: Package Linux bundle
        run: |
          cd .build/app/build/linux/x64/release
          tar czf "$GITHUB_WORKSPACE/yuri-reader-linux.tar.gz" bundle/

      - name: Upload the Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: yuri-reader-linux.tar.gz

  build-android:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node 24 (pkg)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node22-${{ runner.os }}

      - name: Pre-fetch pkg base binaries
        run: |
          # pkg's own undici fetch silently fails on GitHub runners; curl works.
          mkdir -p ~/.pkg-cache/v3.6
          for t in linux-x64 win-x64 macos-x64; do
            f=~/.pkg-cache/v3.6/fetched-v22.23.2-$t
            [ -f "$f" ] || curl -fsSL --retry 3 "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v22.23.2-$t" -o "$f"
            chmod +x "$f"
          done

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compose
        run: ./.scripts/compose.sh

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./.scripts/build.sh android

      - name: Rename the APK
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
          cp .build/app/build/app/outputs/flutter-apk/app-release.apk \
             "yuri-reader-${VERSION}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: yuri-reader-*.apk

  release:
    needs: [gate, build-linux, build-android]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' dart/pubspec.yaml | cut -d' ' -f2)"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Yuri-Reader $TAG" \
              --notes "Built from $(git rev-parse --short HEAD)"
          fi
          # Add only the assets the release is missing; never replace or remove
          # an existing one (no --clobber).
          for asset in yuri-reader-linux.tar.gz "yuri-reader-${VERSION}.apk"; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --json assets -q '.assets[].name' | grep -qx "$asset"; then
              echo "$asset is already on $TAG - leaving it"
            else
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

      - name: Install the Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder jq ostree
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Import the repository signing key
        env:
          YURIREADER_FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.YURIREADER_FLATPAK_GPG_PRIVATE_KEY }}
          YURIREADER_FLATPAK_GPG_PASSPHRASE: ${{ secrets.YURIREADER_FLATPAK_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=""
          for n in YURIREADER_FLATPAK_GPG_PRIVATE_KEY YURIREADER_FLATPAK_GPG_PASSPHRASE; do
            eval "v=\$$n"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/flatpak-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' 'pinentry-mode loopback' > "$GNUPGHOME/gpg.conf"
          printf '%s\n' 'allow-loopback-pinentry' 'allow-preset-passphrase' \
            > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          # Capture the import output: it names the key id, and the keygrip is
          # the filename gpg stores the secret key under. Both are read without
          # a second gpg call, which is what kept failing on the runner.
          import_out="$(printf '%s\n' "$YURIREADER_FLATPAK_GPG_PRIVATE_KEY" \
            | gpg --batch --import 2>&1)"
          key_id="$(printf '%s\n' "$import_out" \
            | sed -n 's/^gpg: key \([0-9A-F]*\): secret key imported.*/\1/p' \
            | head -1)"
          test -n "$key_id"
          # Cache the passphrase in the agent: flatpak-builder signs through
          # gpg with no tty, so a protected key needs the passphrase preset.
          keygrip="$(basename "$(ls "$GNUPGHOME"/private-keys-v1.d/*.key \
            2>/dev/null | head -1)" .key)"
          test -n "$keygrip"
          preset="$(command -v gpg-preset-passphrase || true)"
          [ -n "$preset" ] || preset="$(find /usr/lib/gnupg /usr/libexec /usr/lib \
            -name gpg-preset-passphrase -type f 2>/dev/null | head -1)"
          test -n "$preset"
          gpg-connect-agent reloadagent /bye
          printf '%s' "$YURIREADER_FLATPAK_GPG_PASSPHRASE" \
            | "$preset" --preset "$keygrip"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Resolve the release asset
        id: asset
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' dart/pubspec.yaml)"
          release="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${version}")"
          asset='yuri-reader-linux.tar.gz'
          url="$(jq -r --arg asset "$asset" \
            '.assets[] | select(.name == $asset) | .browser_download_url' \
            <<<"$release")"
          test -n "$url" && test "$url" != null
          archive="$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 --retry-all-errors -o "$archive" "$url"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          size="$(stat -c%s "$archive")"
          date="$(jq -r '.published_at' <<<"$release" | cut -c1-10)"
          printf 'version=%s\nsha256=%s\nsize=%s\ndate=%s\n' \
            "$version" "$sha256" "$size" "$date" >> "$GITHUB_OUTPUT"

      - name: Generate the Flatpak manifest and metainfo
        env:
          VERSION: ${{ steps.asset.outputs.version }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
          SIZE: ${{ steps.asset.outputs.size }}
          RELEASE_DATE: ${{ steps.asset.outputs.date }}
        run: |
          set -euo pipefail
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA256/g" \
            -e "s/@SIZE@/$SIZE/g" \
            .package/flatpak/com.mena.yurireader.yml.in > .package/flatpak/com.mena.yurireader.yml
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@DATE@/$RELEASE_DATE/g" \
            .package/flatpak/com.mena.yurireader.metainfo.xml.in \
            > .package/flatpak/com.mena.yurireader.metainfo.xml

      - name: Build and sign the Flatpak repository
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/flatpak-repo"
          build="$RUNNER_TEMP/flatpak-build"
          flatpak-builder --force-clean --repo="$repo" --default-branch=stable \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
            --install-deps-from=flathub --user \
            "$build" .package/flatpak/com.mena.yurireader.yml
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" --generate-static-deltas "$repo"
          echo "FLATPAK_REPO=$repo" >> "$GITHUB_ENV"

      - name: Assemble the GitHub Pages site
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/pages"
          mkdir -p "$pages/repo"
          cp -a "$FLATPAK_REPO/." "$pages/repo/"
          gpg --batch --armor --export "$FLATPAK_GPG_KEY_ID" > "$pages/yurireader.gpg"
          gpg_key="$(base64 -w0 "$pages/yurireader.gpg")"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          cat > "$pages/yurireader.flatpakrepo" <<EOF
          [Flatpak Repo]
          Title=YuriReader
          Url=https://${owner}.github.io/${repository}/repo
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Comment=YuriReader Flatpak repository
          Description=Signed Flatpak releases of YuriReader.
          GPGKey=${gpg_key}
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4